<?xml version="1.0" encoding="UTF-8"?>
<!--
  EsoYou — primary logo mark.
  Single source of truth: every page references THIS file.
  Future logo changes = edit only this file.

  Design: rounded head + 4-point starburst body (arms curving like
  angel wings + sharp legs as stars). 5 concentric neon outline layers
  (magenta → yellow → green → purple → cyan from outer to inner) with
  a soft glow filter for the neon feel. Background star sparkles
  scattered around evoke the night-sky theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="EsoYou">
  <title>EsoYou</title>
  <defs>
    <!-- Soft glow filter (neon halo around each stroke) -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- The figure: head + body. Recolored per layer via currentColor. -->
    <g id="figure-base">
      <!-- Round head -->
      <circle cx="200" cy="105" r="40" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <!-- Body: arms arcing down (angel wings) + sharp star legs.
           Path traces clockwise from right shoulder. -->
      <path d="M 232 142
               Q 320 110 340 220
               Q 290 195 248 175
               L 245 235
               L 320 365
               L 200 285
               L 80 365
               L 155 235
               L 152 175
               Q 110 195 60 220
               Q 80 110 168 142 Z"
            fill="none" stroke="currentColor" stroke-width="3.5"
            stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- Star sparkle (small 4-point cross) -->
    <g id="star-sparkle">
      <line x1="-2" y1="0" x2="2" y2="0" stroke="currentColor" stroke-width="0.6" stroke-linecap="round"/>
      <line x1="0" y1="-2" x2="0" y2="2" stroke="currentColor" stroke-width="0.6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Background star field (silver dots scattered around the figure) -->
  <g class="bg-stars" stroke="#d8dde8" fill="#d8dde8">
    <circle cx="60"  cy="40"  r="0.8" opacity="0.7"/>
    <circle cx="120" cy="25"  r="0.6" opacity="0.5"/>
    <circle cx="180" cy="15"  r="0.9" opacity="0.85"/>
    <circle cx="290" cy="25"  r="0.7" opacity="0.6"/>
    <circle cx="340" cy="50"  r="0.5" opacity="0.45"/>
    <circle cx="380" cy="115" r="0.8" opacity="0.7"/>
    <circle cx="365" cy="195" r="0.5" opacity="0.5"/>
    <circle cx="380" cy="280" r="0.9" opacity="0.8"/>
    <circle cx="340" cy="345" r="0.6" opacity="0.55"/>
    <circle cx="270" cy="380" r="0.8" opacity="0.7"/>
    <circle cx="160" cy="385" r="0.7" opacity="0.6"/>
    <circle cx="90"  cy="350" r="0.5" opacity="0.45"/>
    <circle cx="30"  cy="270" r="0.8" opacity="0.7"/>
    <circle cx="20"  cy="180" r="0.6" opacity="0.5"/>
    <circle cx="35"  cy="105" r="0.9" opacity="0.85"/>
    <circle cx="220" cy="50"  r="0.5" opacity="0.4"/>
    <circle cx="50"  cy="80"  r="0.55" opacity="0.5"/>
    <circle cx="155" cy="55"  r="0.7"  opacity="0.65"/>
    <circle cx="248" cy="22"  r="0.85" opacity="0.75"/>
    <circle cx="320" cy="48"  r="0.5"  opacity="0.5"/>
    <circle cx="392" cy="160" r="0.55" opacity="0.5"/>
    <circle cx="378" cy="232" r="0.8"  opacity="0.7"/>
    <circle cx="395" cy="320" r="0.5"  opacity="0.45"/>
    <circle cx="305" cy="385" r="0.55" opacity="0.5"/>
    <circle cx="135" cy="395" r="0.5"  opacity="0.45"/>
    <circle cx="60"  cy="385" r="0.65" opacity="0.6"/>
    <circle cx="12"  cy="320" r="0.55" opacity="0.5"/>
    <circle cx="8"   cy="225" r="0.7"  opacity="0.65"/>
    <circle cx="10"  cy="148" r="0.5"  opacity="0.4"/>
    <circle cx="5"   cy="70"  r="0.85" opacity="0.7"/>
    <g transform="translate(50, 50)"   opacity="0.7"><use href="#star-sparkle"/></g>
    <g transform="translate(355, 105)" opacity="0.65"><use href="#star-sparkle"/></g>
    <g transform="translate(360, 305)" opacity="0.6"><use href="#star-sparkle"/></g>
    <g transform="translate(45, 350)"  opacity="0.7"><use href="#star-sparkle"/></g>
    <g transform="translate(105, 380)" opacity="0.55"><use href="#star-sparkle"/></g>
    <g transform="translate(255, 18)"  opacity="0.7"><use href="#star-sparkle"/></g>
    <g transform="translate(388, 200)" opacity="0.65"><use href="#star-sparkle"/></g>
    <g transform="translate(15, 248)"  opacity="0.65"><use href="#star-sparkle"/></g>
    <g transform="translate(180, 5)"   opacity="0.5"><use href="#star-sparkle"/></g>
  </g>

  <!-- The 5 neon layers, scaled around figure visual center (200, 215) -->
  <g filter="url(#neon-glow)">
    <g transform="translate(200 215) scale(1.14) translate(-200 -215)" style="color:#ff3aa1"><use href="#figure-base"/></g>
    <g transform="translate(200 215) scale(1.07) translate(-200 -215)" style="color:#ffe833"><use href="#figure-base"/></g>
    <g transform="translate(200 215) scale(1.00) translate(-200 -215)" style="color:#3aff7a"><use href="#figure-base"/></g>
    <g transform="translate(200 215) scale(0.93) translate(-200 -215)" style="color:#a85aff"><use href="#figure-base"/></g>
    <g transform="translate(200 215) scale(0.86) translate(-200 -215)" style="color:#3affd0"><use href="#figure-base"/></g>
  </g>
</svg>
