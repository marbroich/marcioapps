<?xml version="1.0" encoding="UTF-8"?>
<!--
  EsoYou favicon — simplified for tiny rendering (16x16, 32x32).
  Just the ring + a stylized central figure. No 12 figures, no stars
  (those become noise at favicon size). Recolorable via currentColor.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EsoYou">
  <title>EsoYou</title>

  <!-- Filled circle background (purple/dark for "punch" at small sizes) -->
  <circle cx="32" cy="32" r="30" fill="#1a2a5c"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#6b78a8" stroke-width="1.2"/>

  <!-- Inner dashed ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#a8b4d4" stroke-width="0.6" stroke-dasharray="1 2" opacity="0.7"/>

  <!-- Single Vitruvian figure (centered) — head, torso, arms, legs -->
  <g stroke="#e8edf5" fill="none" stroke-linecap="round">
    <!-- Vitruvian inscribed circle -->
    <circle cx="32" cy="32" r="14" stroke-width="1" opacity="0.45"/>
    <!-- Head -->
    <circle cx="32" cy="22" r="2.5" stroke-width="1.4"/>
    <!-- Torso -->
    <line x1="32" y1="24.5" x2="32" y2="36" stroke-width="1.6"/>
    <!-- Arms (horizontal) -->
    <line x1="20" y1="29" x2="44" y2="29" stroke-width="1.4"/>
    <!-- Legs (V spread) -->
    <line x1="32" y1="36" x2="24" y2="44" stroke-width="1.4"/>
    <line x1="32" y1="36" x2="40" y2="44" stroke-width="1.4"/>
  </g>

  <!-- A few accent stars to evoke the cosmic theme even at this size -->
  <g fill="#e8edf5">
    <circle cx="10" cy="14" r="0.9" opacity="0.85"/>
    <circle cx="54" cy="18" r="0.7" opacity="0.7"/>
    <circle cx="50" cy="50" r="0.8" opacity="0.8"/>
    <circle cx="14" cy="48" r="0.6" opacity="0.6"/>
  </g>
</svg>
