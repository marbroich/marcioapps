<?xml version="1.0" encoding="UTF-8"?>
<!--
  EsoYou favicon — simplified figure for tiny rendering (16-32 px).
  Single-color outline of the head + arms-down body, no neon layers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EsoYou">
  <title>EsoYou</title>

  <!-- Filled circle background (so it pops at tiny sizes) -->
  <circle cx="32" cy="32" r="30" fill="#1a2a5c"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#a8b4d4" stroke-width="0.8"/>

  <!-- The figure: head + simplified body (arms curving down + sharp legs) -->
  <g stroke="#ff3aa1" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Head -->
    <circle cx="32" cy="20" r="6"/>
    <!-- Body outline: arms curve down + sharp star legs -->
    <path d="M 37 26
             Q 49 23 51 38
             Q 44 35 39 30
             L 39 39
             L 50 56
             L 32 47
             L 14 56
             L 25 39
             L 25 30
             Q 20 35 13 38
             Q 15 23 27 26 Z"/>
  </g>

  <!-- A few accent stars -->
  <g fill="#e8edf5">
    <circle cx="10" cy="14" r="0.8" opacity="0.85"/>
    <circle cx="54" cy="18" r="0.6" opacity="0.7"/>
    <circle cx="50" cy="50" r="0.7" opacity="0.8"/>
    <circle cx="14" cy="48" r="0.5" opacity="0.6"/>
  </g>
</svg>
