<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="styles/tailwind.out.css">
  <title>Marcio Scharrenbroich Simão</title>
  <meta name="description" content="Marcio Scharrenbroich Simão — Caraguatatuba, Brasil.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Marcio Scharrenbroich Simão">
  <meta property="og:image" content="assets/cover.png">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .display { font-family: 'Playfair Display', Georgia, serif; }
    .hero {
      background-image:
        linear-gradient(180deg, rgba(2,6,23,0.05) 0%, rgba(2,6,23,0.55) 70%, rgba(2,6,23,0.85) 100%),
        url('assets/cover.png');
      background-size: cover;
      background-position: center;
    }
    /* Show only the active language */
    html[data-lang="pt"] [data-i18n="en"],
    html[data-lang="en"] [data-i18n="pt"] { display: none; }
    /* Toggle button states */
    .lang-btn { transition: all 0.15s; }
    html[data-lang="pt"] .lang-btn[data-set="pt"],
    html[data-lang="en"] .lang-btn[data-set="en"] {
      background: rgba(255,255,255,0.95);
      color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-white antialiased">
  <main class="hero min-h-screen flex flex-col">
    <header class="px-6 sm:px-10 pt-8 flex items-center justify-between text-sm">
      <span class="tracking-widest uppercase text-white/80">Caraguatatuba · Brasil</span>
      <div class="flex items-center gap-2">
        <div class="inline-flex rounded-full border border-white/30 bg-white/10 backdrop-blur p-1" role="group" aria-label="Language">
          <button type="button" class="lang-btn rounded-full px-3 py-1 text-xs font-semibold uppercase tracking-wider text-white/90" data-set="pt" aria-label="Português">PT</button>
          <button type="button" class="lang-btn rounded-full px-3 py-1 text-xs font-semibold uppercase tracking-wider text-white/90" data-set="en" aria-label="English">EN</button>
        </div>
        <a href="https://www.facebook.com/people/Marvoz-Studio/100091892807694/" target="_blank" rel="noopener"
           class="hidden sm:inline-block text-white/80 hover:text-white border border-white/30 hover:border-white/70 rounded-full px-4 py-1.5 transition-colors">
          Marvoz Studio →
        </a>
      </div>
    </header>

    <div class="flex-1 flex flex-col items-center justify-center px-6 text-center">
      <p class="text-sm sm:text-base uppercase tracking-[0.3em] text-white/70 mb-4">
        <span data-i18n="pt">Bem-vindo</span>
        <span data-i18n="en">Welcome</span>
      </p>
      <h1 class="display text-5xl sm:text-7xl lg:text-8xl font-bold leading-tight drop-shadow-lg">
        Marcio Scharrenbroich Simão
      </h1>
      <p class="mt-6 max-w-xl text-lg sm:text-xl text-white/90">
        <span data-i18n="pt">Site pessoal — em construção.</span>
        <span data-i18n="en">Personal site — under construction.</span>
      </p>
      <div class="mt-10 inline-flex items-center gap-2 px-4 py-2 rounded-full border border-white/30 bg-white/10 backdrop-blur text-sm text-white/85">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span data-i18n="pt">Em breve, mais por aqui</span>
        <span data-i18n="en">More coming soon</span>
      </div>
    </div>

    <footer class="px-6 sm:px-10 pb-8 text-center text-xs text-white/60">
      <p>© <span id="year"></span> Marcio Scharrenbroich Simão</p>
    </footer>
  </main>

  <script>
    (function () {
      var html = document.documentElement;
      var saved = localStorage.getItem('lang');
      var browser = (navigator.language || 'en').toLowerCase();
      var initial = saved || (browser.indexOf('pt') === 0 ? 'pt' : 'en');
      setLang(initial);

      document.querySelectorAll('.lang-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { setLang(btn.dataset.set); });
      });

      function setLang(lang) {
        html.setAttribute('data-lang', lang);
        html.setAttribute('lang', lang === 'pt' ? 'pt-BR' : 'en');
        try { localStorage.setItem('lang', lang); } catch (e) {}
      }

      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
